name: BA4L
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '20'
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: FM45AMFBNY
    CODE_SIGN_STYLE: Automatic
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.16.0
targets:
  BA4L:
    type: application
    dependencies:
      - package: LiveKit
    configFiles:
      Debug: Config/Auth.xcconfig
      Release: Config/Auth.xcconfig
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes: [Info.plist, AppIcon.svg]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dougkvamme.StrikeCeiling
        PRODUCT_NAME: BA4L
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: BA4L
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Resources/Info.plist
      properties:
        BA4LSupabaseURL: "https://aqrigyieuzceksptwfci.supabase.co"
        BA4LSupabaseAnonKey: "$(BA4L_SUPABASE_ANON_KEY)"
        CFBundleDisplayName: BA4L
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: BA4L uses the camera for live lane observation and scoreboard photos.
        NSMicrophoneUsageDescription: BA4L records a short team sound only when you choose to record. Live video does not automatically share your microphone.
        NSPhotoLibraryUsageDescription: BA4L reads a scoreboard photo you choose to fill in rolls.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  BA4L:
    build:
      targets:
        BA4L: all
    run:
      config: Debug
    archive:
      config: Release
